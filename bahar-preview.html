<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>عطر بهار | پیش‌نمایش اپلیکیشن</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f7f7f8;color:#252525}
.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fff;border-bottom:1px solid #eee;box-shadow:0 2px 8px #0000000c;position:relative;z-index:2}
.brand{font-weight:800;color:#d5ad25}.sub{font-size:10px;color:#777;font-weight:400;display:block;text-align:center;margin-top:3px}
.actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:9px 12px;background:#f4bd00;color:#191919;font-weight:bold;text-decoration:none;font-size:12px}
main{height:calc(100% - 54px);position:relative}iframe{width:100%;height:100%;border:0;background:white}.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:28px;text-align:center;background:#fafafa}.box{max-width:360px;background:white;border-radius:24px;padding:28px;box-shadow:0 12px 35px #0001;line-height:2}.box h2{color:#d3a91e}.box p{color:#666;font-size:14px}
</style></head><body>
<header class="top"><div class="brand">عطر بهار<span class="sub">BAHAR PERFUMES</span></div><div class="actions"><a class="btn" href="https://baharperfumes.ir/" target="_blank" rel="noopener">باز کردن فروشگاه</a></div></header>
<main><iframe id="store" src="https://baharperfumes.ir/" title="فروشگاه زنده عطر بهار" allow="payment *"></iframe><section class="fallback" id="fallback"><div class="box"><h2>فروشگاه عطر بهار</h2><p>برای اینکه همه محصولات، قیمت‌ها، موجودی، حساب کاربری و سفارش‌ها دقیقاً با سایت اصلی هماهنگ باشند، نسخه زنده فروشگاه بارگذاری می‌شود. اگر نمایش داخل این پیش‌نمایش محدود بود، فروشگاه را مستقیم باز کنید.</p><a class="btn" href="https://baharperfumes.ir/" target="_blank" rel="noopener">ورود به فروشگاه اصلی</a></div></section></main>
<script>
// Some browsers block third-party/local-file iframe embedding. Keep a direct live-site fallback.
setTimeout(()=>{const f=document.getElementById('store');try{if(!f.contentWindow||f.contentWindow.location.href==='about:blank')document.getElementById('fallback').style.display='flex'}catch(e){/* cross-origin access is expected; iframe itself remains usable */}},7000);
</script></body></html>
